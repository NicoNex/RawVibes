name: Packages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita vulkan-icd-loader \
            gettext unzip python-onnx python-numpy
      - uses: actions/checkout@v4
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder git config --global --add safe.directory "$PWD"
          sudo -u builder make arch
      - uses: actions/upload-artifact@v4
        with:
          name: rawvibes-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme librsvg gettext dylibbundler
          python -m pip install onnx numpy
          echo "GETTEXT_DIR=$(brew --prefix gettext)" >> "$GITHUB_ENV"
      - name: Build the .dmg
        run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rawvibes-macos
          path: target/rawvibes-*.dmg
          if-no-files-found: error
