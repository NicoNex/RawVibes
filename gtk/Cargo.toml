[package]
name = "rawvibes"
description = "RawVibes: RAW photo editor with colour grading and 3D LUT export (GTK4/libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rawvibes-core = { path = "../core" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_50"] }
gettext-sys = { version = "0.27", features = ["gettext-system"] }
relm4-icons = "0.11"

[build-dependencies]
relm4-icons-build = "0.11"
