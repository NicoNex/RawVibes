name: Packages

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita vulkan-icd-loader \
            gettext unzip python-onnx python-numpy
      - uses: actions/checkout@v5
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder git config --global --add safe.directory "$PWD"
          set -o pipefail
          sudo -u builder make arch 2>&1 | tee build.log || { echo "::error title=make arch::$(tail -40 build.log | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: rawvibes-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme librsvg gettext dylibbundler
          python -m pip install onnx numpy
          echo "GETTEXT_DIR=$(brew --prefix gettext)" >> "$GITHUB_ENV"
      - name: Build the .dmg
        # The log tail goes into an annotation, readable without opening the run.
        run: |
          set -o pipefail
          make dmg 2>&1 | tee build.log || { echo "::error title=make dmg::$(tail -40 build.log | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: rawvibes-macos
          path: target/rawvibes-*.dmg
          if-no-files-found: error

  release:
    name: Publish the latest build
    needs: [arch, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --title "Latest build" --latest --notes "Built from ${GITHUB_SHA::7} on master.

          **Arch Linux:** \`sudo pacman -U rawvibes-*.pkg.tar.zst\`

          **macOS (Apple silicon):** open the \`.dmg\`, drag RawVibes to Applications, then run \`xattr -cr /Applications/RawVibes.app\` once (the app is not signed with an Apple Developer ID)."
