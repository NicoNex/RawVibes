name: Packages

# master publishes the "latest" release; a manual run on another branch only builds.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux packages (GTK and Qt)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita vulkan-icd-loader \
            gettext unzip python-onnx python-numpy cmake nasm lensfun libjxl qt6-base qt6-declarative
      - uses: actions/checkout@v7
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder git config --global --add safe.directory "$PWD"
          sudo -u builder bash tools/ci-make.sh arch
      - uses: actions/upload-artifact@v7
        with:
          name: rawvibes-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macOS disk images (GTK and Qt)
    needs: [models]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme librsvg gettext dylibbundler jpeg-xl cmake nasm lensfun qt
          echo "GETTEXT_DIR=$(brew --prefix gettext)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: models
          path: models/rawnind
      - name: Build the .dmg files
        # The models came converted: -o keeps make from fetching the archive to convert them again.
        run: bash tools/ci-make.sh -o target/models/rawdenoise-nind.dtmodel dmg dmg-qt
      - uses: actions/upload-artifact@v7
        with:
          name: rawvibes-macos
          path: target/rawvibes-*.dmg
          if-no-files-found: error

  # The AI models, converted once for macOS and Windows (MSYS2 does not package onnx).
  models:
    name: AI denoise models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: |
          python -m pip install onnx numpy
          make models
      - uses: actions/upload-artifact@v7
        with:
          name: models
          path: models/rawnind
          if-no-files-found: error

  windows:
    name: Windows (Qt)
    needs: [models]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip unzip git
          pacboy: >-
            rust:p gcc:p cmake:p nasm:p pkgconf:p python:p gettext-tools:p libjxl:p lensfun:p
            qt6-base:p qt6-declarative:p qt6-svg:p qt6-tools:p
      - uses: actions/download-artifact@v8
        with:
          name: models
          path: models/rawnind
      - uses: Swatinem/rust-cache@v2
      - name: Put the DLLs Qt's tools load next to them
        # cxx-qt runs moc, rcc and qmlcachegen with an empty environment: no PATH to find
        # /ucrt64/bin's DLLs from MSYS2's share/qt6 folders.
        run: |
          for d in "$(qmake6 -query QT_HOST_BINS)" "$(qmake6 -query QT_HOST_LIBEXECS)"; do
            d=$(cygpath -u "$d"); [ "$d" = /ucrt64/bin ] && continue
            for t in "$d"/*.exe; do ldd "$t"; done | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u | xargs -r cp -n -t "$d"
          done
          env -i "$(cygpath -u "$(qmake6 -query QT_HOST_LIBEXECS)")/moc.exe" -v
      - name: Build the .zip
        run: |
          export GETTEXT_DIR=/ucrt64 PATH="/ucrt64/bin:$PATH"
          bash tools/ci-make.sh zip-qt
      - uses: actions/upload-artifact@v7
        with:
          name: rawvibes-windows
          path: target/rawvibes-qt-*-windows.zip
          if-no-files-found: error

  release:
    name: Publish the latest build
    if: github.ref == 'refs/heads/master'
    needs: [arch, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rawvibes-*
          path: dist
          merge-multiple: true
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --title "Latest build" --latest --notes "Built from ${GITHUB_SHA::7} on master. RawVibes comes with two interfaces over the same engine and edits: GTK (Linux, macOS) and Qt (Linux, macOS, Windows; HDR preview on HDR screens).

          **Arch Linux:** \`sudo pacman -U rawvibes-common-*.pkg.tar.zst\` plus \`rawvibes-[0-9]*.pkg.tar.zst\` (GTK) or \`rawvibes-qt-*.pkg.tar.zst\` (Qt).

          **macOS (Apple silicon):** open \`rawvibes-*.dmg\` (GTK) or \`rawvibes-qt-*.dmg\` (Qt), drag the app to Applications, then run \`xattr -cr /Applications/RawVibes.app\` (or \`RawVibes-Qt.app\`) once: the app is not signed with an Apple Developer ID.

          **Windows (x64):** unzip \`rawvibes-qt-*-windows.zip\` and run \`RawVibes-Qt\\bin\\rawvibes-qt.exe\`."
