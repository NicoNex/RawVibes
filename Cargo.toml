[workspace]
resolver = "3"
members = ["core", "gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

# rawler's Markesteijn wraps negative CFA offsets on purpose (`color_at`); release does, debug must too.
[profile.dev.package.rawler]
overflow-checks = false
